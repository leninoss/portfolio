<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/bilder/{{ site.data.projekt.hero.bild }}-1200.jpg">
  <meta property="og:type" content="website">
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/barlow-condensed-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/barlow-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/variables.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <script>document.documentElement.classList.add('js')</script>
  <script src="{{ site.baseurl }}/assets/js/main.js" defer></script>
</head>
<body>
  {{ content }}
</body>
</html>
