  bild: feld-drehung-gegenlicht
  alt: "Eine Performerin dreht sich im Gegenlicht auf einer Sommerwiese, der Rock aus weißen Handschuhen schwingt auf."
  video: ""   # z. B. hero-loop.mp4 – leer = nur Bild

idee:
  lead: "Ein Netz aus Berührungen spannt sich über unseren Alltag. Manche dauern nur einen Augenblick, andere bleiben über Jahre. Oft nehmen wir sie kaum wahr, und doch verbinden sie uns miteinander."
  text: |
    In meinem Semesterprojekt „Fast Berührt“ beschäftige ich mich mit diesen flüchtigen, alltäglichen Berührungen und ihrer Bedeutung. Aus weißen Handschuhen, die miteinander und ineinander vernäht sind, entsteht ein textiles Geflecht, das die unsichtbaren Verbindungen zwischen Menschen sichtbar macht. Es erzählt von Nähe und Distanz, von Fremdheit und Vertrautheit und von kleinen Berührungen, die unseren Alltag prägen.

    Was kaum auffällt, kann dennoch fehlen. Denn Berührungen sind überall. Manchmal spürbar, manchmal kaum wahrnehmbar, aber immer ein Teil von uns.
  bild: detail-handschuhe-auf-kleid
  alt: "Zwei Hände in weißen Handschuhen liegen auf dem Kleid aus vernähten Handschuhen."

