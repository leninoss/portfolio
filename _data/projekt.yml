volltext:
  label: "Text — Marla Noss"
  text: |
    Ein Netz aus Berührungen spannt sich über den Körper. Manche bleiben jahrelang, andere nur für den Bruchteil einer Sekunde. Sie verschwinden, kaum dass sie geschehen sind, und verweben sich doch zu etwas, das bleibt.

    Die Kassiererin legt das Wechselgeld in meine offene Hand, kurz streifen sich unsere Finger. Im Zug lehnt sich ein Fremder im Schlaf gegen meine Schulter. Ineinander eingehakt laufen drei Frauen. Bei 30 Grad wünscht man sich Distanz. Der Kopf lehnt für einen Moment gegen die kalte Fensterscheibe. Die einzige Berührung heute.

    Sich nah und fremd sein. Sich ansehen. Ein Blick, der beinah berührt. Und dann die Stille um 5 Uhr morgens, auch die kann einen berühren.

    Wenn die Hände meiner Freundin voller Farbe wären, wäre mein Körper längst bunt von all ihren Umarmungen.

material:
  text: "Das Kostüm besteht aus einem Oberteil, einem hohen Kragen und einem langen Rock, gefertigt aus über hundert weißen Baumwollhandschuhen. Viele von ihnen sind aufgeschnitten und zu flachen Handformen ausgebreitet. Von Hand mit- und ineinander vernäht, greifen Finger in Finger, Handflächen legen sich aneinander. So entsteht ein durchbrochenes Geflecht, dessen Zwischenräume Licht und Haut sichtbar lassen. Zum Saum hin löst sich der Rock in einzelne Finger auf, die sich mit jeder Bewegung öffnen."
  text_ist_platzhalter: false
  bild_klein: detail-handstoff-warmes-licht
  alt_klein: "Detail: vernähte Handschuhe in warmem Abendlicht."
  bild_gross: detail-handstoff-gegenlicht
  alt_gross: "Detail: das Geflecht aus Handschuhen im Gegenlicht, durch die Lücken scheint Gras."
  clip: { platzhalter: "Detail-Clip" }

prozess:
  text: "Einen Anfang zu finden, war nicht leicht. Den Anstoß gab schließlich ein Bildbeispiel: ein hoher Kragen aus Händen, der mit dem Gesicht in Berührung tritt. Weitere Vorbilder folgten, in denen Hände und Handschuhe Körperteile umschlingen. Mit den ersten bestellten Handschuhen begannen die Materialversuche: aufschneiden, zu Flächen formen, mit- und ineinander vernähen, am Körper drapieren. Dabei zeigte sich, dass die Handschuhe auch Menschen verbinden, sobald mehrere ihre Hände hineinstecken. Der Stoff verformt sich mit jeder Bewegung, und zwischen den Körpern entsteht immer wieder etwas Neues, so wie sich Beziehungen mit der Zeit verändern. Diese Erfahrung ist auch in den Film eingeflossen."
  text_ist_platzhalter: false
  elemente:
    - { platzhalter: "Skizze" }
    - { platzhalter: "Materialtest" }
    - { platzhalter: "Skizze" }
    - { platzhalter: "Making-of" }

